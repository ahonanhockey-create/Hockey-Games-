<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriTrack - Search Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">NutriTrack</div>
        <div class="nav-links">
            <a href="index.html">Drink Info</a>
            <a href="drink-ratings.html">Drink Ratings</a>
            <a href="foods.html">Food Info</a>
            <a href="food-ratings.html">Food Ratings</a>
            <a href="search.html" class="active">Search Tool</a>
        </div>
    </nav>

    <header class="hero">
        <h1>🔍 Food & Drink Lookup Engine</h1>
        <p>Search any item to inspect calories, sugar content, additives, and health rating!</p>
    </header>

    <main class="container">
        <div class="card">
            <h2>Search Database</h2>
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Type a food or drink name..." required>
                <button type="submit">Search</button>
            </form>
        </div>

        <div id="results" class="results-container">
            <!-- Search results will render here dynamically -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
